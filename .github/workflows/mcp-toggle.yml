name: MCP Toggle (on-demand)

# Manually scale the blogmarks-prod-mcp Fargate service up or down.
#
# terraform/terraform.tfvars sets ecs_desired_count=0 by default, so a
# `terraform apply` will NOT bring the service back up. After bringing it
# up via this workflow, avoid running terraform apply until you scale back
# down (Terraform will reconcile the desiredCount back to 0).
#
# This service does NOT use Application Auto Scaling, so we only call
# `aws ecs update-service`. Adding ASG would require a Terraform change
# and an additional autoscaling permission on the OIDC role.
#
# Inputs:
#   action          up | down (default: up)
#   desired_count   1..2, used only when action=up (default: 1)
#   ttl_minutes     0..240, when >0 and action=up schedules an auto-down

on:
  workflow_dispatch:
    inputs:
      action:
        description: "up = scale to desired_count, down = scale to 0"
        required: true
        type: choice
        default: up
        options:
          - up
          - down
      desired_count:
        description: "Desired task count (1-2). Only used when action=up."
        required: false
        type: number
        default: 1
      ttl_minutes:
        description: "Auto-down after N minutes (0 = disabled, max 240)."
        required: false
        type: number
        default: 0

permissions:
  id-token: write
  contents: read

concurrency:
  group: mcp-toggle-blogmarks
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  CLUSTER: blogmarks-prod-cluster
  SERVICE: blogmarks-prod-mcp

jobs:
  validate:
    name: Validate inputs
    runs-on: ubuntu-latest
    steps:
      - name: Check ranges
        run: |
          DC="${{ inputs.desired_count }}"
          TTL="${{ inputs.ttl_minutes }}"
          if ! [[ "$DC" =~ ^[0-9]+$ ]] || (( DC < 1 || DC > 2 )); then
            echo "::error::desired_count must be 1..2, got '$DC'"; exit 1
          fi
          if ! [[ "$TTL" =~ ^[0-9]+$ ]] || (( TTL < 0 || TTL > 240 )); then
            echo "::error::ttl_minutes must be 0..240, got '$TTL'"; exit 1
          fi

  scale:
    name: Scale ${{ inputs.action }} (count=${{ inputs.desired_count }})
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TOGGLE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve target count
        id: targets
        run: |
          if [[ "${{ inputs.action }}" == "up" ]]; then
            echo "count=${{ inputs.desired_count }}" >> "$GITHUB_OUTPUT"
          else
            echo "count=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply scale ${{ inputs.action }}
        env:
          DESIRED: ${{ steps.targets.outputs.count }}
        run: |
          set -euo pipefail
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" \
            --desired-count "$DESIRED" >/dev/null
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
          aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[].{name:serviceName,desired:desiredCount,running:runningCount}' \
            --output table

      - name: Smoke test (up only)
        if: inputs.action == 'up'
        run: |
          set -euo pipefail
          # ALB health-check should already be passing if services-stable returned;
          # an extra public probe catches DNS / ACM / cloudfront issues.
          for i in 1 2 3 4 5; do
            if curl -fsS -o /dev/null -w "%{http_code}\n" https://mcp.blogmarks.dev/health | grep -q '^200$'; then
              echo "OK: /health returned 200"
              exit 0
            fi
            echo "attempt $i: /health not yet 200, sleeping"
            sleep 10
          done
          echo "::warning::/health did not return 200 after 50s"
          exit 1

  schedule-down:
    name: Auto-down after TTL
    if: inputs.action == 'up' && inputs.ttl_minutes > 0
    needs: scale
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 250
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TOGGLE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sleep ${{ inputs.ttl_minutes }} min then scale down
        env:
          TTL: ${{ inputs.ttl_minutes }}
        run: |
          set -euo pipefail
          echo "Sleeping $TTL minutes before auto-down…"
          sleep "$(( TTL * 60 ))"
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" \
            --desired-count 0 >/dev/null
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
          aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[].{name:serviceName,desired:desiredCount,running:runningCount}' \
            --output table
