name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Sync and test
        run: |
          uv sync --extra dev --extra crew
          uv run python -m pytest tests/ -q --ignore=tests/test_api.py --ignore=tests/test_e2e_sse.py

  rust-fetch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/blogmarks-fetch
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
