[project]
name = "mcp-bookmarks"
version = "1.0.1"
description = "MCP server for intelligent bookmark management with AI-powered tagging"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # <2.0: the 2.x SDK removed mcp.server.fastmcp (bit us in the container
    # build 2026-08-09 — pip resolves fresh here, unlike uv.lock's 1.26.0).
    "mcp[cli]>=1.2.0,<2.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.30.0",
    "trafilatura>=1.12.0",
    "boto3>=1.34.0",
    "pyjwt[crypto]>=2.8.0",
]

[project.optional-dependencies]
# Cloud semantic search over Knowledge bookmarks (EC2/DynamoDB deployment).
# Imported lazily in knowledge_index.py + embeddings_bedrock.py, so the base
# install (SQLite/stdio) does not pull these in.
semantic = [
    "hnswlib>=0.8.0",
    "numpy>=1.26.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "asgi-lifespan>=2.1.0",
    "moto[dynamodb]>=5.0.0",
    "hnswlib>=0.8.0",
    "numpy>=1.26.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Default test run = unit + integration (no live network / no real AWS).
# Run live tests explicitly: `pytest -m live` or via CI workflow_dispatch.
# Coverage floor ratchets up over time. Round 1 (PR #30): 40% → 57%, floor 50%.
# Round 2 (PR #31): 57% → 79%, floor 60%.
# Round 3 (this PR): 79% → 90%, floor 85%.
addopts = "-m 'not live' --cov=src/mcp_bookmarks --cov-report=term-missing --cov-fail-under=85"
markers = [
    "live: opt-in tests that hit real external services (network, AWS, real URLs)",
]

[tool.coverage.run]
source = ["src/mcp_bookmarks"]
branch = true
# Omitted:
#   cli.py / __main__.py — entry-point shims exercised via the binary, not pytest.
#   server.py — exercised via test_transports.py, which spawns uvicorn as a
#     subprocess. Coverage can't track child processes without a sitecustomize
#     hook + COVERAGE_PROCESS_START; that refactor is tracked as a follow-up
#     (CONTRIBUTING.md "What we chose not to test"). Until then, omitting keeps
#     the measured % honest — server.py IS tested, just not by this metric.
#   _static/ — woff2 + dashboard assets.
omit = ["*/cli.py", "*/__main__.py", "*/server.py", "*/_static/*"]

[tool.coverage.paths]
# Collapse installed package path (from `uv run`) and source path so
# coverage credits integration tests that import via the installed name.
source = ["src/mcp_bookmarks", "*/site-packages/mcp_bookmarks"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[project.scripts]
mcp-bookmarks = "mcp_bookmarks.server:main"
mcp-bookmarks-cli = "mcp_bookmarks.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_bookmarks"]

# ── Lint + format (Ruff) ─────────────────────────────────────────────
#
# Run locally: `make lint` (check) and `make format` (apply).
# CI enforces both — see .github/workflows/ci.yml.

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "lambda/handler.py",        # sample template (see ADR-0006); snake_case schema
    "src/mcp_bookmarks/_static", # binary asset directory
    "terraform/.build",          # generated zips
]

[tool.ruff.lint]
# Conservative starter set. Add codes here when we want to enforce more.
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort import ordering
    "B",   # bugbear (common gotchas)
    "UP",  # pyupgrade
    "SIM", # simplify (catch dead branches, redundant if/else)
    "RUF", # ruff-specific (e.g. mutable class defaults)
]
ignore = [
    "E501",  # line-length already enforced by the formatter; lint complaints are noisy
    "B008",  # function default at definition — Starlette `Depends(...)` style is fine
    "SIM117", # nested with-blocks — keeping them explicit is often clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "B011",  # assert False — fine in tests
    "B017",  # pytest.raises(Exception) — fine in negative tests
]

[tool.ruff.lint.isort]
known-first-party = ["mcp_bookmarks"]

# ── Type checking (mypy) ─────────────────────────────────────────────
#
# Pragmatic baseline — not strict. We catch obvious type errors and
# missing-import bugs without forcing every untyped helper to be annotated.
# Run locally: `make typecheck`. CI enforces.

[tool.mypy]
python_version = "3.11"
files = ["src/mcp_bookmarks"]
ignore_missing_imports = true           # boto3, trafilatura, etc. lack stubs
check_untyped_defs = true               # type-check inside un-annotated functions
warn_unused_ignores = true              # surface stale `# type: ignore`
warn_redundant_casts = true
warn_unreachable = true
show_error_codes = true
# Do NOT enable strict mode in this PR — the existing src/ has ~70% type
# coverage and turning on strict would surface hundreds of errors. The
# right path is incremental: enable per-module strict overrides as
# coverage improves. Tracked as a follow-up.

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true  # tests use pytest fixtures + MagicMock heavily; not worth typing today
