[project]
name = "mcp-bookmarks"
version = "0.8.0"
description = "MCP server for intelligent bookmark management with AI-powered tagging"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.30.0",
    "trafilatura>=1.12.0",
    "boto3>=1.34.0",
    "pyjwt[crypto]>=2.8.0",
]

[project.optional-dependencies]
crew = [
    "crewai>=0.86.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "asgi-lifespan>=2.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"



[project.scripts]
mcp-bookmarks = "mcp_bookmarks.server:main"
mcp-bookmarks-cli = "mcp_bookmarks.cli:main"
blogmarks-crew = "blogmarks_crew.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_bookmarks", "src/blogmarks_crew"]
