[package]
name = "blogmarks-fetch"
version = "0.1.0"
edition = "2021"
description = "CLI placeholder: fetch URL and emit JSON metadata (extend with readability extraction)."

[[bin]]
name = "blogmarks-fetch"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
